plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
    }
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.80'
}

// covellite-core is a plain Java library, not a NeoForge mod. In a userdev
// run the mod's secure-jar classloader only sees classes inside the mod's own
// output, so compile the core sources as part of this module. This also makes
// the distributed jar self-contained without duplicate-class ambiguity.
sourceSets.main.java.srcDir project(':covellite-core').file('src/main/java')

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            version: version
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
